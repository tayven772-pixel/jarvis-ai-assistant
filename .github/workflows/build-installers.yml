name: Build JARVIS Windows and Android downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer and source ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set automatic version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          npm pkg set version=$version
          "$version" | Out-Null
          "version=$version" >> $env:GITHUB_OUTPUT
          "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Package source ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exclude = @(".git", "node_modules", "dist", "release", "android", ".env")
          $items = Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath "jarvis-source-v$version.zip" -Force
      - name: Prepare stable download names
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced." }
          Copy-Item $installer.FullName "jarvis-windows-latest.exe" -Force
          Copy-Item "jarvis-source-v${{ steps.version.outputs.version }}.zip" "jarvis-source-latest.zip" -Force
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JARVIS v${{ steps.version.outputs.version }}
          body: "Automatically built Windows release of JARVIS AI Assistant."
          make_latest: true
          generate_release_notes: true
          files: |
            release/*.exe
            jarvis-source-v${{ steps.version.outputs.version }}.zip
            jarvis-windows-latest.exe
            jarvis-source-latest.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-v${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            jarvis-source-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Configure Android app permissions and bridge
        run: python3 scripts/configure_android_manifest.py
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
