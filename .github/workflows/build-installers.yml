name: Build JARVIS Windows downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer and source ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Package source ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exclude = @(".git", "node_modules", "dist", "release", "android", ".env")
          $items = Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath "jarvis-source-v$version.zip" -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-v${{ steps.version.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-source-v${{ steps.version.outputs.version }}
          path: jarvis-source-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
