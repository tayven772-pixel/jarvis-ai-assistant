name: Build JARVIS Windows downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer and source ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate build version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          npm pkg set version=$version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run desktop:build
      - name: Package source ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exclude = @(".git", "node_modules", "dist", "release", "android", ".env")
          $items = Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath "jarvis-source-v$version.zip" -Force
      - name: Prepare stable download names
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          Copy-Item $installer.FullName "jarvis-windows-latest.exe"
          Copy-Item "jarvis-source-v${{ steps.version.outputs.version }}.zip" "jarvis-source-latest.zip"
      - name: Publish versioned GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JARVIS v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/*.exe
            jarvis-source-v${{ steps.version.outputs.version }}.zip
            jarvis-windows-latest.exe
            jarvis-source-latest.zip
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-v${{ steps.version.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-source-v${{ steps.version.outputs.version }}
          path: jarvis-source-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
